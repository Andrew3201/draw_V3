<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PrecisionSketch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a fixed drafting frame. Two-row toolbar on top, document rail left, properties right, status strip below; the sheet fills the rest. */
:root {
  --chrome: #eef1f4;
  --panel: #f8f9fb;
  --raise: #ffffff;
  --ink: #17212b;
  --ink-2: #52606d;
  --ink-3: #8894a1;
  --line: #d3d9e0;
  --line-2: #e3e7ec;
  --accent: #c2570c;
  --accent-soft: #fbe9dc;
  --ok: #17212b;
  --under: #1764d8;
  --bad: #c9271c;
  --bad-soft: #fde8e6;
  --on-bad: #ffffff;

  --cv-bg: #fcfdfe;
  --cv-grid: #edf0f4;
  --cv-grid-major: #dde2e9;
  --cv-axis: #aab4c0;
  --cv-defined: #17212b;
  --cv-under: #1764d8;
  --cv-conflict: #d42a1e;
  --cv-select: #e06a0a;
  --cv-hover: #f3a25b;
  --cv-dim: #3b4856;
  --cv-driven: #8894a1;
  --cv-glyph-bg: #ffffff;
  --cv-glyph-line: #b9c2cc;
  --cv-glyph-fg: #3f6f4a;
  --cv-region: #5b7186;
  --cv-infer: #1e8a4c;

  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --rail-l: 208px;
  --rail-r: 268px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #161b21; --panel: #1b2128; --raise: #232a33; --ink: #e4e9ee; --ink-2: #a3afbb; --ink-3: #6f7c89;
    --line: #313a45; --line-2: #262e37; --accent: #ff914d; --accent-soft: #3a2a1e; --ok: #e4e9ee; --under: #66a6ff;
    --bad: #ff7366; --bad-soft: #3b2220; --on-bad: #240a07;
    --cv-bg: #11151a; --cv-grid: #181d24; --cv-grid-major: #212831; --cv-axis: #4a5663; --cv-defined: #e4e9ee;
    --cv-under: #5b9dff; --cv-conflict: #ff6658; --cv-select: #ff9a4a; --cv-hover: #b9703a; --cv-dim: #b3bfcb;
    --cv-driven: #6f7c89; --cv-glyph-bg: #1f262e; --cv-glyph-line: #3b4652; --cv-glyph-fg: #7fd09a; --cv-region: #8ea3b8;
    --cv-infer: #5fd08c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #161b21; --panel: #1b2128; --raise: #232a33; --ink: #e4e9ee; --ink-2: #a3afbb; --ink-3: #6f7c89;
  --line: #313a45; --line-2: #262e37; --accent: #ff914d; --accent-soft: #3a2a1e; --ok: #e4e9ee; --under: #66a6ff;
  --bad: #ff7366; --bad-soft: #3b2220; --on-bad: #240a07;
  --cv-bg: #11151a; --cv-grid: #181d24; --cv-grid-major: #212831; --cv-axis: #4a5663; --cv-defined: #e4e9ee;
  --cv-under: #5b9dff; --cv-conflict: #ff6658; --cv-select: #ff9a4a; --cv-hover: #b9703a; --cv-dim: #b3bfcb;
  --cv-driven: #6f7c89; --cv-glyph-bg: #1f262e; --cv-glyph-line: #3b4652; --cv-glyph-fg: #7fd09a; --cv-region: #8ea3b8;
  --cv-infer: #5fd08c;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--chrome); color: var(--ink);
  font: 13px/1.4 var(--sans);
  overflow: hidden; overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

#app {
  height: 100%;
  display: grid;
  grid-template-columns: var(--rail-l) minmax(0, 1fr) var(--rail-r);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "doc doc doc" "tools tools tools" "left stage right" "status status status";
}

/* document bar */
#docbar {
  grid-area: doc; display: flex; align-items: center; gap: 4px;
  padding: 5px 10px; border-bottom: 1px solid var(--line); background: var(--chrome); min-width: 0;
}
.brand { font-weight: 600; letter-spacing: .01em; margin-right: 10px; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.brand svg { color: var(--accent); }
.spacer { flex: 1 1 auto; min-width: 4px; }
.btn {
  height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--raise);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: var(--chrome); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.quiet { border-color: transparent; background: transparent; }
.btn.quiet:hover { background: var(--line-2); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.seg, .btn, .brand { flex: 0 0 auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--raise); }
.seg button { height: 26px; padding: 0 12px; border: 0; background: transparent; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--chrome); }

/* tool bar */
#toolbar {
  grid-area: tools; display: flex; align-items: stretch; gap: 0; padding: 0 6px;
  border-bottom: 1px solid var(--line); background: var(--panel);
  overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; min-width: 0;
}
.grp { display: flex; flex-direction: column; padding: 3px 8px 4px; border-right: 1px solid var(--line-2); flex: 0 0 auto; }
.grp:last-child { border-right: 0; }
.grp-label { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); line-height: 1; padding: 2px 2px 3px; }
.grp-row { display: flex; gap: 1px; }
.tb {
  width: 32px; height: 30px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--ink-2);
  display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto;
}
.tb:hover { background: var(--line-2); color: var(--ink); }
.tb[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tb svg, .btn svg { width: 18px; height: 18px; display: block; }

/* rails */
.rail { background: var(--panel); overflow-y: auto; overflow-x: hidden; min-width: 0; scrollbar-width: thin; }
#left { grid-area: left; border-right: 1px solid var(--line); }
#right { grid-area: right; border-left: 1px solid var(--line); }
.sec { padding: 10px 12px 12px; border-bottom: 1px solid var(--line-2); }
.sec h2 { margin: 0 0 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.row { display: grid; grid-template-columns: 78px minmax(0, 1fr); align-items: center; gap: 6px; min-height: 26px; }
.row + .row { margin-top: 4px; }
.row.tight { grid-template-columns: 46px minmax(0, 1fr); }
.row.tight .field[data-kind="hex"] { padding: 0 5px; min-width: 66px; }
.row > label, .row > .lab { color: var(--ink-2); }
.field {
  width: 100%; height: 26px; padding: 0 7px; border: 1px solid var(--line); border-radius: 3px; background: var(--raise);
  font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 0;
}
select.field { font-family: var(--sans); padding: 0 4px; }
.field:disabled { opacity: .55; }
.pair { display: flex; gap: 6px; align-items: center; min-width: 0; }
.check { display: flex; align-items: center; gap: 7px; min-height: 24px; color: var(--ink-2); }
.check input { margin: 0; accent-color: var(--accent); }
.hint { color: var(--ink-3); font-size: 12px; line-height: 1.45; margin: 0; }
.hint + .hint { margin-top: 6px; }
.kv { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink); overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; border: 1px solid var(--line); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); }
.pill.under { color: var(--under); }
.pill.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.list li { display: flex; align-items: center; gap: 7px; min-height: 26px; padding: 1px 4px 1px 6px; border-radius: 3px; min-width: 0; }
.list li.click { cursor: pointer; }
.list li.click:hover, .list li.hot { background: var(--line-2); }
.list li.on { background: var(--accent-soft); }
.list li .grow { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list li.bad .grow { color: var(--bad); }
.x { width: 22px; height: 22px; border: 0; background: transparent; color: var(--ink-3); border-radius: 3px; flex: 0 0 auto; line-height: 1; font-size: 14px; }
.x:hover { background: var(--bad-soft); color: var(--bad); }
.sw { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--line); flex: 0 0 auto; background-color: #fff; }
.sw.none { background-image: linear-gradient(135deg, transparent 46%, #d42a1e 46%, #d42a1e 54%, transparent 54%); }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.swatches button { width: 18px; height: 18px; padding: 0; border-radius: 3px; border: 1px solid var(--line); }
.swatches button:hover { transform: scale(1.12); }
input[type="color"] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: var(--raise); flex: 0 0 auto; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-width: 0; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.btn.small { height: 24px; padding: 0 8px; font-size: 12px; }
.btnrow.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.btnrow.grid2 .btn { justify-content: center; }
kbd { font-family: var(--mono); font-size: 11px; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--raise); color: var(--ink-2); }

/* stage */
#stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; background: var(--cv-bg); overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#dimedit {
  position: absolute; width: 96px; height: 26px; margin: -13px 0 0 -48px; text-align: center;
  border: 1.5px solid var(--accent); border-radius: 3px; background: var(--raise); color: var(--ink);
  font-family: var(--mono); font-size: 12.5px; z-index: 5;
}
#toast {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px));
  padding: 8px 12px; border-radius: 5px; background: var(--ink); color: var(--chrome); font-size: 12.5px; line-height: 1.45;
  box-shadow: 0 4px 18px rgba(0, 0, 0, .22); z-index: 6;
}
#toast.bad { background: var(--bad); color: var(--on-bad); }
#toast ul { margin: 4px 0 0; padding-left: 18px; }
#viewtag {
  position: absolute; left: 10px; top: 8px; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-3); pointer-events: none;
}
#example {
  position: absolute; right: 10px; top: 8px; display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px;
  border: 1px solid var(--line); border-radius: 5px; background: var(--raise); color: var(--ink-2); font-size: 12px; z-index: 4;
  max-width: calc(100% - 20px);
}

/* status */
#status {
  grid-area: status; display: flex; align-items: center; gap: 14px; padding: 3px 10px; min-height: 26px;
  border-top: 1px solid var(--line); background: var(--chrome); color: var(--ink-2); font-size: 12px; min-width: 0;
}
#status .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
#coords { min-width: 168px; }
#hint { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* menus and dialogs */
.menu {
  position: absolute; z-index: 20; min-width: 190px; padding: 4px; background: var(--raise); border: 1px solid var(--line);
  border-radius: 5px; box-shadow: 0 8px 24px rgba(0, 0, 0, .16);
}
.menu button { display: flex; width: 100%; justify-content: space-between; gap: 18px; padding: 6px 9px; border: 0; background: transparent; border-radius: 3px; text-align: left; }
.menu button:hover { background: var(--line-2); }
.menu hr { border: 0; border-top: 1px solid var(--line-2); margin: 4px 0; }
#scrim { position: fixed; inset: 0; background: rgba(10, 14, 18, .45); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
.dialog {
  width: min(520px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, .3); padding: 16px 18px 14px;
}
.dialog h1 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
.dialog .row { grid-template-columns: 110px minmax(0, 1fr); }
.dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.dialog .note { margin: 10px 0 0; padding: 8px 10px; border-radius: 4px; background: var(--line-2); color: var(--ink-2); font-size: 12px; line-height: 1.45; }
.preview {
  margin-top: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 10px; text-align: center; overflow: auto; max-height: 300px;
  background-color: #fff;
  background-image: linear-gradient(45deg, #e9ecef 25%, transparent 25%, transparent 75%, #e9ecef 75%), linear-gradient(45deg, #e9ecef 25%, transparent 25%, transparent 75%, #e9ecef 75%);
  background-size: 14px 14px; background-position: 0 0, 7px 7px;
}
.preview img { max-width: 100%; max-height: 260px; }
textarea.code { width: 100%; height: 150px; margin-top: 10px; font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; background: var(--raise); color: var(--ink); padding: 6px; resize: vertical; }
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 18px; }
.keys div { display: flex; justify-content: space-between; gap: 8px; min-height: 22px; align-items: center; }

.only-narrow { display: none; }
@media (max-width: 940px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "doc" "tools" "stage" "status"; }
  .rail { position: fixed; top: 0; bottom: 0; z-index: 25; width: min(280px, 86vw); box-shadow: 0 0 30px rgba(0, 0, 0, .28); }
  #left { left: 0; } #right { right: 0; }
  .rail:not(.open) { display: none; }
  .only-narrow { display: inline-flex; }
  .brand span { display: none; }
  #docbar { padding: 5px 8px; gap: 2px; }
  .seg button { padding: 0 8px; }
  #coords { min-width: 0; }
  #zoom, .hide-narrow { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 480px) {
  .brand, #btnFit { display: none; }
}

</style>

<div id="app">
  <header id="docbar">
    <button class="btn icon quiet only-narrow" id="btnLeft" type="button" title="Document panel" aria-label="Document panel"></button>
    <div class="brand" id="brand"></div>
    <button class="btn quiet" id="btnFile" type="button" aria-haspopup="true">File</button>
    <button class="btn icon quiet" id="btnUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
    <button class="btn icon quiet" id="btnRedo" type="button" title="Redo (Ctrl+Y)" aria-label="Redo"></button>
    <div class="spacer"></div>
    <button class="btn icon quiet" id="btnFit" type="button" title="Zoom to fit (F)" aria-label="Zoom to fit"></button>
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="btnSketch" aria-pressed="true" title="Sketch view: dimensions, constraints and construction geometry (Tab)">Sketch</button>
      <button type="button" id="btnClean" aria-pressed="false" title="Clean view: exactly what is exported (Tab)">Clean</button>
    </div>
    <button class="btn" id="btnCopy" type="button" title="Copy the drawing as a 300 dpi image for pasting into PowerPoint or Visio"><span class="hide-narrow">Copy as image</span></button>
    <button class="btn primary" id="btnExport" type="button" title="Export SVG or PNG"><span class="hide-narrow">Export</span></button>
    <button class="btn icon quiet only-narrow" id="btnRight" type="button" title="Properties panel" aria-label="Properties panel"></button>
  </header>

  <nav id="toolbar" aria-label="Sketch tools"></nav>

  <aside class="rail" id="left" aria-label="Document"></aside>

  <main id="stage">
    <canvas id="cv" tabindex="0" aria-label="Drawing area"></canvas>
    <div id="viewtag"></div>
    <div id="example" hidden><span>Example drawing</span><button class="btn small" id="btnBlank" type="button">Start blank</button><button class="x" id="btnExampleClose" type="button" aria-label="Dismiss">&times;</button></div>
    <input id="dimedit" type="text" autocomplete="off" spellcheck="false" aria-label="Dimension value" hidden>
    <div id="toast" role="status" hidden></div>
  </main>

  <aside class="rail" id="right" aria-label="Properties"></aside>

  <footer id="status">
    <span class="mono" id="coords"></span>
    <span id="dof"></span>
    <span id="hint"></span>
    <span class="mono" id="zoom"></span>
  </footer>
</div>
<input id="fileIn" type="file" accept=".json,application/json" hidden>

<script>
const PS = (function () {
'use strict';
// =====================================================================
// PrecisionSketch core: document model, units, expressions, constraint
// solver and degree-of-freedom analysis. No DOM access in this file.
// Geometry is stored in millimetres with Y up.
// =====================================================================

const UNITS = { mm: 1, cm: 10, in: 25.4, pt: 25.4 / 72, px: 25.4 / 96 };
const TAU = Math.PI * 2;
const TOL = 1e-7;        // residual (mm) accepted as "constraint holds"
const TOL_GOAL = 1e-10;  // residual the solver aims for
const RADIUS_STIFFNESS = 100;

function normAng(a) { a %= TAU; return a < 0 ? a + TAU : a; }
function wrapPi(a) { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; }

function fmtNum(v, prec) {
  if (!isFinite(v)) return '?';
  let s = v.toFixed(prec);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  if (s === '-0') s = '0';
  return s;
}
function fmtLen(mm, doc) { return fmtNum(mm / UNITS[doc.units], doc.precision); }

// ---------------------------------------------------------------------
// Expressions: "42.5", "1.5 in", "40/2 + 3", "(10 + 2.5) * 2 mm".
// Plain numbers are document units (or degrees for angles).
// ---------------------------------------------------------------------
function evalExpr(src, env) {
  env = env || {};
  const unit = env.units || 'mm';
  const kind = env.kind || 'length';
  const vars = env.vars || {};
  const s = String(src);
  let i = 0;
  const toks = [];
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    const mnum = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i));
    if (mnum) { toks.push({ t: 'n', v: parseFloat(mnum[0]) }); i += mnum[0].length; continue; }
    const mid = /^[A-Za-z_][A-Za-z0-9_]*/.exec(s.slice(i));
    if (mid) { toks.push({ t: 'id', v: mid[0] }); i += mid[0].length; continue; }
    if (ch === '°') { toks.push({ t: 'id', v: 'deg' }); i++; continue; }
    if (ch === '"') { toks.push({ t: 'id', v: 'in' }); i++; continue; }
    if ('+-*/^()'.indexOf(ch) >= 0) { toks.push({ t: ch }); i++; continue; }
    if (ch === '×') { toks.push({ t: '*' }); i++; continue; }
    if (ch === '÷') { toks.push({ t: '/' }); i++; continue; }
    if (ch === ',') { return { ok: false, error: 'Use a point as the decimal separator' }; }
    return { ok: false, error: 'Unexpected "' + ch + '"' };
  }
  if (!toks.length) return { ok: false, error: 'Enter a value' };
  let p = 0;
  const peek = () => toks[p];
  const isUnit = n => Object.prototype.hasOwnProperty.call(UNITS, n) || n === 'm' || n === 'deg' || n === 'rad';
  const FN = { sqrt: Math.sqrt, abs: Math.abs, sin: Math.sin, cos: Math.cos, tan: Math.tan };
  function fail(m) { throw new Error(m); }
  // values carry a length exponent L and an angle flag A (already radians)
  function withUnit(val, name) {
    if (val.L !== 0 || val.A) fail('A unit can only follow a plain number');
    if (name === 'deg') return { v: val.v * Math.PI / 180, L: 0, A: true };
    if (name === 'rad') return { v: val.v, L: 0, A: true };
    if (name === 'm') return { v: val.v * 1000, L: 1, A: false };
    return { v: val.v * UNITS[name], L: 1, A: false };

// --- sparse (envelope) Cholesky --------------------------------------

  // ------------------------------------------------------------------

    s.addEventListener('mousedown', e => { if (e.target === s) closeDialog(); });
    document.body.appendChild(s);
    const f = s.querySelector('[autofocus], button, input, select');
    if (f) f.focus();
    return s;
  }
  async function copyText(text, okMsg) {
    try { await navigator.clipboard.writeText(text); toast(okMsg); return true; }
    catch (err) { return false; }
  }
  // Shown when a file cannot be saved or an image cannot be copied directly.
  function fallbackDialog(o) {
    let h = '<h1>' + o.title + '</h1><p class="hint">' + o.why + '</p>';
    if (o.imgUrl) h += '<div class="preview"><img alt="Drawing" src="' + o.imgUrl + '"></div><p class="note">Right-click the image and choose <b>Copy image</b>, then paste it into PowerPoint or Visio. ' + (o.size || '') + '</p>';
    if (o.text) h += '<textarea class="code" id="f-code" readonly aria-label="File contents">' + esc(o.text) + '</textarea>';
    h += '<div class="foot">' + (o.text ? '<button class="btn" type="button" id="dlgCopyText">' + (o.textLabel || 'Copy text') + '</button>' : '') +
      (o.save ? '<button class="btn" type="button" id="dlgSave">' + o.saveLabel + '</button>' : '') + '<button class="btn primary" type="button" id="dlgClose">Done</button></div>';
    const s = dialog(h);
    s.querySelector('#dlgClose').onclick = closeDialog;
    if (o.text) s.querySelector('#dlgCopyText').onclick = async () => {
      if (!(await copyText(o.text, 'Copied.'))) { const ta = s.querySelector('#f-code'); ta.focus(); ta.select(); toast('Press Ctrl+C to copy the selected text.'); }
    };
    if (o.save) s.querySelector('#dlgSave').onclick = o.save;
  }
  async function copyImage() {
    const sel = exportItems('selection'), items = sel.length ? sel : st.items;
    if (!items.length) { toast('Nothing to copy yet. Draw a closed shape or a line first.'); return; }
    const out = renderPNG(items, { dpi: 300 });
    const svg = PS.buildSVG(items, {});
    const what = sel.length ? 'Selection' : 'Drawing';
    const sizeTxt = PS.fmtNum(out.mmW, 2) + ' × ' + PS.fmtNum(out.mmH, 2) + ' mm at ' + Math.round(out.dpi) + ' dpi.';
    let failed = null;
    try {
      if (!navigator.clipboard || !window.ClipboardItem) throw new Error('This browser has no image clipboard.');
      const parts = { 'image/png': out.blob };
      let withSvg = false;
      try { withSvg = !!(ClipboardItem.supports && ClipboardItem.supports('image/svg+xml')); } catch (e) { withSvg = false; }
      if (withSvg) {
        try { await navigator.clipboard.write([new ClipboardItem(Object.assign({ 'image/svg+xml': new Blob([svg.svg], { type: 'image/svg+xml' }) }, parts))]); }
        catch (e) { await navigator.clipboard.write([new ClipboardItem({ 'image/png': out.blob })]); withSvg = false; }
      } else await navigator.clipboard.write([new ClipboardItem(parts)]);
      toast(what + ' copied as an image' + (withSvg ? ' (PNG and SVG)' : '') + ', ' + sizeTxt + ' Paste it into PowerPoint or Visio.');
      return;
    } catch (err) { failed = err; }
    let blob;
    try { blob = await out.blob; } catch (err) { toast('The image could not be created.', true); return; }
    const url = URL.createObjectURL(blob);
    fallbackDialog({
      title: 'Copy as image',
      why: 'This page is not allowed to write images to the clipboard here, so copy it by hand or save the file.',
      imgUrl: url, size: sizeTxt,
      save: async () => { const r = await saveFile('drawing.png', blob, 'image/png'); if (r === 'saved') toast('Saved drawing.png.'); else if (r === 'unavailable') toast('Saving is not available in this view. Use right-click, Copy image.', true); },
      saveLabel: 'Save PNG', text: svg.svg, textLabel: 'Copy SVG code'
    });
  }
  function exportDialog() {
    const hasSel = exportItems('selection').length > 0;
    const h = '<h1>Export</h1>' +
      '<div class="row"><label for="x-fmt">Format</label><select class="field" id="x-fmt">' + opt('svg', 'SVG (editable vectors)', 'svg') + opt('png', 'PNG (image)', 'svg') + '</select></div>' +
      '<div class="row"><label for="x-scope">Include</label><select class="field" id="x-scope">' + opt('all', 'Whole drawing', hasSel ? 'selection' : 'all') + (hasSel ? opt('selection', 'Selection only', 'selection') : '') + '</select></div>' +
      '<div id="x-svg"><div class="row"><label for="x-frame">Picture frame</label><select class="field" id="x-frame">' + opt('stroke', 'Geometry plus outline width', 'stroke') + opt('geometry', 'Geometry only (exact size)', 'stroke') + '</select></div>' +
      '<div class="row"><label for="x-arcs">Arcs</label><select class="field" id="x-arcs">' + opt('arc', 'True arcs', 'arc') + opt('bezier', 'Bézier curves', 'arc') + '</select></div></div>' +
      '<div id="x-png" hidden><div class="row"><label for="x-dpi">Resolution</label><div class="pair"><input class="field" id="x-dpi" value="300" inputmode="numeric"><span class="lab">dpi</span></div></div>' +
      '<div class="row"><label for="x-bg">Background</label><select class="field" id="x-bg">' + opt('', 'Transparent', '') + opt('#ffffff', 'White', '') + '</select></div></div>' +
      '<p class="note" id="x-info"></p>' +
      '<div class="foot"><button class="btn" type="button" id="x-cancel">Cancel</button><button class="btn" type="button" id="x-copy">Copy SVG code</button><button class="btn primary" type="button" id="x-go" autofocus>Save file</button></div>';
    const s = dialog(h);
    const q = id => s.querySelector('#' + id);
    const read = () => ({ fmt: q('x-fmt').value, scope: q('x-scope').value, frame: q('x-frame').value, bezier: q('x-arcs').value === 'bezier', dpi: Math.max(10, Math.min(2400, parseFloat(q('x-dpi').value) || 300)), bg: q('x-bg').value });
    const info = () => {
      const o = read(), items = exportItems(o.scope);
      q('x-svg').hidden = o.fmt !== 'svg'; q('x-png').hidden = o.fmt !== 'png'; q('x-copy').hidden = o.fmt !== 'svg';
      if (!items.length) { q('x-info').textContent = 'Nothing to export yet. Shapes appear once the sketch has a closed loop or a line.'; q('x-go').disabled = true; return; }
      q('x-go').disabled = false;
      const b = PS.itemsBounds(items), u = PS.UNITS[st.doc.units], f = v => PS.fmtNum(v / u, Math.max(st.doc.precision, 2));
      const gw = b.geom[2] - b.geom[0], gh = b.geom[3] - b.geom[1], sw = b.stroke[2] - b.stroke[0], sh = b.stroke[3] - b.stroke[1];
      const n = items.length + (items.length === 1 ? ' shape' : ' shapes');
      if (o.fmt === 'svg') {
        q('x-info').innerHTML = o.frame === 'geometry'
          ? n + '. Picture size <b>' + f(gw) + ' × ' + f(gh) + ' ' + st.doc.units + '</b>, exactly the geometry. Outlines sit half outside the frame; some programs crop that half until you convert the picture to shapes.'
          : n + '. Picture size <b>' + f(sw) + ' × ' + f(sh) + ' ' + st.doc.units + '</b>: the ' + f(gw) + ' × ' + f(gh) + ' geometry plus the outline width. After Convert to Shape in PowerPoint the shapes measure ' + f(gw) + ' × ' + f(gh) + '.';
      } else {
        const k = o.dpi / 25.4;
        q('x-info').innerHTML = n + '. <b>' + Math.ceil(sw * k) + ' × ' + Math.ceil(sh * k) + ' px</b>, which is ' + f(sw) + ' × ' + f(sh) + ' ' + st.doc.units + ' at ' + o.dpi + ' dpi. The file records its physical size.';
      }
    };
    for (const id of ['x-fmt', 'x-scope', 'x-frame', 'x-arcs', 'x-dpi', 'x-bg']) q(id).addEventListener('input', info);
    info();
    q('x-cancel').onclick = closeDialog;
    q('x-copy').onclick = async () => {
      const o = read(), out = PS.buildSVG(exportItems(o.scope), o);
      if (out && await copyText(out.svg, 'SVG code copied.')) closeDialog();
      else if (out) fallbackDialog({ title: 'SVG code', why: 'Copying was blocked here. Select the text below and copy it.', text: out.svg, textLabel: 'Copy SVG code' });
    };
    q('x-go').onclick = async () => {
      const o = read(), items = exportItems(o.scope);
      if (!items.length) return;
      if (o.fmt === 'svg') {
        const out = PS.buildSVG(items, o);
        const r = await saveFile('drawing.svg', out.svg, 'image/svg+xml');
        if (r === 'saved') { closeDialog(); toast('Saved drawing.svg. In PowerPoint use Insert, Pictures, then Convert to Shape to edit it.', false, 6500); }
        else if (r === 'unavailable') fallbackDialog({ title: 'Export SVG', why: 'Saving files is not available in this view. Copy the SVG code and save it as a .svg file, or open this page in a browser tab to download.', text: out.svg, textLabel: 'Copy SVG code' });
      } else {
        const out = renderPNG(items, { dpi: o.dpi, background: o.bg || null });
        let blob;
        try { blob = await out.blob; } catch (err) { toast('The image could not be created.', true); return; }
        const r = await saveFile('drawing.png', blob, 'image/png');
        if (r === 'saved') { closeDialog(); toast('Saved drawing.png. ' + out.note); }
        else if (r === 'unavailable') fallbackDialog({ title: 'Export PNG', why: 'Saving files is not available in this view.', imgUrl: URL.createObjectURL(blob), size: out.W + ' × ' + out.H + ' px.' });
      }
    };
  }
  async function saveProject() {
    const text = PS.serialize(st.doc);
    const r = await saveFile('drawing.precisionsketch.json', text, 'application/json');
    if (r === 'saved') toast('Saved drawing.precisionsketch.json.');
    else if (r === 'unavailable') fallbackDialog({ title: 'Save drawing', why: 'Saving files is not available in this view. Copy the text below into a file ending in .json to keep the drawing; File, Open reads it back.', text, textLabel: 'Copy drawing file' });
  }
  function openProject(file) {
    const fr = new FileReader();
    fr.onload = () => {
      const r = PS.parseDoc(String(fr.result));
      if (r.error) { toast(esc(r.error), true, 6000); return; }
      st.example = false; $('example').hidden = true;
      loadDoc(r.doc, true);
      toast('Opened ' + esc(file.name) + '. Undo returns to the previous drawing.');
    };
    fr.onerror = () => toast('That file could not be read.', true);
    fr.readAsText(file);
  }
  function fileMenu() {
    const old = document.querySelector('.menu');
    if (old) { old.remove(); return; }
    const m = document.createElement('div');
    m.className = 'menu';
    m.innerHTML = '<button type="button" data-m="new"><span>New drawing</span></button><button type="button" data-m="open"><span>Open…</span></button><button type="button" data-m="save"><span>Save drawing…</span></button><hr>' +
      '<button type="button" data-m="export"><span>Export SVG or PNG…</span></button><button type="button" data-m="copy"><span>Copy as image</span></button><hr>' +
      '<button type="button" data-m="example"><span>Load the example</span></button><button type="button" data-m="keys"><span>Keyboard shortcuts</span></button>';
    const r = $('btnFile').getBoundingClientRect();
    m.style.left = r.left + 'px'; m.style.top = (r.bottom + 4) + 'px';
    document.body.appendChild(m);
    const close = ev => { if (!ev || !m.contains(ev.target)) { m.remove(); document.removeEventListener('mousedown', close, true); } };
    setTimeout(() => document.addEventListener('mousedown', close, true), 0);
    m.addEventListener('click', e => {
      const b = e.target.closest('[data-m]');
      if (!b) return;
      m.remove(); document.removeEventListener('mousedown', close, true);
      const k = b.dataset.m;
      if (k === 'new') { st.example = false; $('example').hidden = true; loadDoc(PS.newDoc(), true); toast('New drawing. Undo brings the previous one back.'); }
      else if (k === 'open') $('fileIn').click();
      else if (k === 'save') saveProject();
      else if (k === 'export') exportDialog();
      else if (k === 'copy') copyImage();
      else if (k === 'example') { loadDoc(exampleDoc(), true); st.example = true; $('example').hidden = false; }
      else if (k === 'keys') keysDialog();
    });
  }
  function keysDialog() {
    const rows = [['Select', 'Esc'], ['Line', 'L'], ['Rectangle', 'R'], ['Circle', 'C'], ['Arc', 'A'], ['Dimension', 'D'], ['Construction on/off', 'Q'], ['Coincident', 'I'], ['Horizontal', 'H'], ['Vertical', 'V'], ['Parallel', 'B'], ['Perpendicular', 'Shift+L'], ['Tangent', 'T'], ['Equal', 'E'], ['Concentric', 'O'], ['Midpoint', 'M'], ['Fix', 'X'], ['Delete selection', 'Delete'], ['Undo / Redo', 'Ctrl+Z / Ctrl+Y'], ['Bring forward / send backward', 'Ctrl+] / Ctrl+['], ['Bring to front / send to back', 'Ctrl+Shift+] / Ctrl+Shift+['], ['Sketch / Clean view', 'Tab'], ['Zoom to fit', 'F'], ['Pan', 'Right or middle drag, Space+drag'], ['Zoom', 'Scroll'], ['Snapping off', 'Hold Shift']];
    const s = dialog('<h1>Keyboard shortcuts</h1><div class="keys">' + rows.map(r => '<div><span>' + r[0] + '</span><kbd>' + r[1] + '</kbd></div>').join('') + '</div><div class="foot"><button class="btn primary" type="button" id="dlgClose">Done</button></div>');
    s.querySelector('#dlgClose').onclick = closeDialog;
  }

  // ------------------------------------------------------------------
  // example drawing shown on first open
  // ------------------------------------------------------------------
  function exampleDoc() {
    const d = PS.newDoc(), E = d.entities;
    const keep = st.doc; st.doc = d;     // dimension placement helpers read st.doc
    const R = PS.addRect(d, 0, 0, 70, 40), [b, r, t, l] = R.lines;
    PS.addCon(d, { type: 'coincident', refs: [R.p1, 'O'] });
    const dim = (c, x, y) => { c.pos = posFromPoint(c, { x, y }); return PS.addCon(d, c); };
    dim({ type: 'distance', refs: [b], mode: 'aligned', value: 70 }, 35, -9);
    dim({ type: 'distance', refs: [r], mode: 'aligned', value: 40 }, 79, 20);
    const c1 = PS.addCircle(d, 15, 20, 6), c2 = PS.addCircle(d, 49, 20, 6);
    dim({ type: 'distance', refs: [E[c1].c, l], value: 15 }, 7.5, 47);
    dim({ type: 'distance', refs: [E[c1].c, b], value: 20 }, -9, 10);
    dim({ type: 'diameter', refs: [c1], value: 12 }, 15 + 9, 20 + 11);
    PS.addCon(d, { type: 'equal', refs: [c1, c2] });
    PS.addCon(d, { type: 'horizontal', refs: [E[c1].c, E[c2].c] });
    PS.trySolve(d);
    const sys = PS.buildSystem(d), topo = PS.computeTopology(d, sys);
    PS.syncShapes(d, topo);
    const plate = topo.faces.find(f => f.parent < 0);
    if (plate) { plate.rec.fill = '#58a6f0'; plate.rec.stroke = '#17212b'; plate.rec.sw = 0.5; plate.rec.user = true; }
    st.doc = keep;
    return d;
  }

  // ------------------------------------------------------------------
  // keyboard and start-up
  // ------------------------------------------------------------------
  function onKey(e) {
    st.keys.shift = e.shiftKey;
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'select' || tag === 'textarea';
    if ($('scrim')) { if (e.key === 'Escape') closeDialog(); return; }
    if (e.target === $('dimedit')) {
      if (e.key === 'Enter') { if (setDim(editing, e.target.value)) { closeDimEdit(); cv.focus({ preventScroll: true }); } else e.target.select(); e.preventDefault(); }
      else if (e.key === 'Escape') { closeDimEdit(); cv.focus({ preventScroll: true }); e.preventDefault(); }
      e.stopPropagation(); return;
    }
    if (typing) { if (e.key === 'Enter' && tag === 'input') e.target.blur(); if (e.key === 'Escape') { e.target.blur(); cv.focus({ preventScroll: true }); } return; }
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const onControl = tag === 'button' || tag === 'a';
    if (onControl && (k === ' ' || k === 'Enter' || k === 'Tab')) return;   // leave keyboard navigation alone
    if (k === 'Escape' && document.querySelector('.menu')) { document.querySelector('.menu').remove(); return; }
    if (e.ctrlKey || e.metaKey) {
      if (k === 'z' && !e.shiftKey) { travel(-1); e.preventDefault(); }
      else if (k === 'y' || (k === 'z' && e.shiftKey)) { travel(1); e.preventDefault(); }
      else if (k === 's') { saveProject(); e.preventDefault(); }
      else if (e.ctrlKey && (e.code === 'BracketRight' || e.code === 'BracketLeft') && selectedShapes().length) {
        const up = e.code === 'BracketRight';
        reorder(e.shiftKey ? (up ? 'front' : 'back') : (up ? 'forward' : 'backward'));
        e.preventDefault();
      }
      return;
    }
    if (e.altKey) return;
    if (k === ' ') { st.keys.space = true; if (!st.pan) cv.style.cursor = 'grab'; e.preventDefault(); return; }
    if (k === 'Tab') { setMode(st.mode === 'sketch' ? 'clean' : 'sketch'); e.preventDefault(); return; }
    if (k === 'Escape') {
      hintOverride = null;
      if (st.tool !== 'select' && (st.ts.a || (st.ts.picks && st.ts.picks.length))) { st.ts = st.ts.picks ? { picks: [] } : {}; st.infer = null; }
      else if (st.tool !== 'select') setTool('select');
      else { st.sel.clear(); queuePanels(); }
      requestDraw(); return;
    }
    if (k === 'Delete' || k === 'Backspace') { deleteSelection(); e.preventDefault(); return; }
    if (k === 'f') { fitView(); return; }
    if (k === 'q') { toggleConstruction(); return; }
    if (k === 'l' && e.shiftKey) { hintOverride = null; setTool('perpendicular'); return; }
    if (KEYMAP[k]) { hintOverride = null; setTool(KEYMAP[k]); }
  }
  function start() {
    readColors();
    buildToolbar();
    try { const c = JSON.parse(localStorage.getItem(STORE + '.colors') || '[]'); if (Array.isArray(c)) st.recent = c.filter(x => /^#[0-9a-f]{6}$/.test(x)).slice(0, 8); } catch (e) { /* fine */ }
    resize();
    let doc = null;
    try { const saved = localStorage.getItem(STORE); if (saved) { const r = PS.parseDoc(saved); if (r.doc && Object.keys(r.doc.entities).length > 2) doc = r.doc; } } catch (e) { /* no storage */ }
    if (!doc) { doc = exampleDoc(); st.example = true; $('example').hidden = false; }
    loadDoc(doc);
    buildPanels();

    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', () => { st.pan = null; st.press = null; st.box = null; if (st.drag) dragEnd(); });
    cv.addEventListener('pointerleave', () => { st.mouse.in = false; if (!st.press) { st.hover = null; st.infer = null; } requestDraw(); });
    cv.addEventListener('wheel', onWheel, { passive: false });
    cv.addEventListener('dblclick', onDbl);
    cv.addEventListener('contextmenu', e => e.preventDefault());
    // focus is managed in onDown; the default would steal it back from the dimension box
    cv.addEventListener('mousedown', e => e.preventDefault());
    window.addEventListener('keydown', onKey);
    window.addEventListener('keyup', e => { st.keys.shift = e.shiftKey; if (e.key === ' ') { st.keys.space = false; if (!st.pan) cv.style.cursor = st.tool === 'select' ? 'default' : 'crosshair'; } });
    $('dimedit').addEventListener('blur', () => { setTimeout(() => { if (editing) { setDim(editing, $('dimedit').value); closeDimEdit(); } }, 0); });
    for (const id of ['left', 'right']) {
      $(id).addEventListener('input', onPanelInput);
      $(id).addEventListener('change', onPanelChange);
      $(id).addEventListener('click', onPanelClick);
      $(id).addEventListener('mouseover', onPanelHover);
      $(id).addEventListener('mouseleave', () => { if (st.hover) { st.hover = null; requestDraw(); } });
    }
    $('btnUndo').onclick = () => travel(-1);
    $('btnRedo').onclick = () => travel(1);
    $('btnFit').onclick = fitView;
    $('btnSketch').onclick = () => setMode('sketch');
    $('btnClean').onclick = () => setMode('clean');
    $('btnCopy').onclick = copyImage;
    $('btnExport').onclick = exportDialog;
    $('btnFile').onclick = fileMenu;
    $('btnLeft').onclick = () => { $('left').classList.toggle('open'); $('right').classList.remove('open'); };
    $('btnRight').onclick = () => { $('right').classList.toggle('open'); $('left').classList.remove('open'); };
    $('stage').addEventListener('pointerdown', () => { $('left').classList.remove('open'); $('right').classList.remove('open'); });
    $('btnBlank').onclick = () => { st.example = false; $('example').hidden = true; loadDoc(PS.newDoc(), true); setTool('line'); };
    $('btnExampleClose').onclick = () => { $('example').hidden = true; };
    $('fileIn').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) openProject(f); e.target.value = ''; });
    new ResizeObserver(resize).observe($('stage'));
    const themeChange = () => { readColors(); requestDraw(); };
    try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeChange); } catch (e) { /* older browsers */ }
    new MutationObserver(themeChange).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readColors(); requestDraw(); });
    downloadsCap();
    setHint(null);
  }
  // keep the drawing across a republish of this page
  const hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => { try { localStorage.setItem(STORE, JSON.stringify(st.doc)); } catch (e) { /* fine */ } return {}; }); } catch (e) { /* optional */ }
  if (hot && hot.ready) hot.ready(start); else start();
})();

</script>
